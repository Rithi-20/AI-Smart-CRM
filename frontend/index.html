<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCRM AI — Enterprise CRM Workspace</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            outfit: ['Outfit', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="bg-[#F7F8FC] text-[#0F172A] antialiased">
  <div id="app" class="flex min-h-screen">
    <!-- Sidebar Navigation -->
    <aside
      class="w-[240px] bg-[#111827] border-r border-[#1F2937] flex flex-col h-screen sticky top-0 text-slate-100 select-none z-30 flex-shrink-0">
      <div class="p-4 border-b border-[#1F2937] flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-lg bg-indigo-600/20 border border-indigo-500/40 flex items-center justify-center text-indigo-400 font-bold text-xl">
          ⚡</div>
        <div>
          <h1 class="font-extrabold text-base text-white tracking-tight leading-none font-outfit">SmartCRM AI</h1>
          <span class="text-[11px] text-indigo-400 font-medium">Data-Driven CRM</span>
        </div>
      </div>

      <nav class="flex-1 p-3 space-y-1 overflow-y-auto" id="nav-container"></nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto overflow-y-auto w-full">
      <header class="flex items-center justify-between pb-4 mb-4 border-b border-slate-200">
        <div>
          <h1 class="text-xl font-extrabold text-slate-900 tracking-tight font-outfit" id="page-title">Overview
            Dashboard</h1>
          <p class="text-xs text-slate-500 mt-0.5" id="page-desc">Real-time pipeline metrics and key sales performance
            indicators</p>
        </div>

        <div class="flex items-center gap-4">
          <div class="relative cursor-pointer p-2 rounded-full hover:bg-slate-200/60 transition-colors">
            <span class="text-lg">🔔</span>
            <span class="absolute top-1 right-1 w-2.5 h-2.5 bg-rose-500 rounded-full ring-2 ring-white"></span>
          </div>

          <div class="flex items-center gap-2.5 bg-white border border-slate-200 rounded-full py-1 px-3 shadow-2xs">
            <div
              class="w-7 h-7 rounded-full bg-indigo-600 text-white font-bold text-xs flex items-center justify-center">
              CU</div>
            <div class="text-left pr-1">
              <div class="text-xs font-bold text-slate-900 leading-none">CRM User</div>
              <div class="text-[10px] text-slate-500 font-medium">Sales Manager</div>
            </div>
          </div>
        </div>
      </header>

      <div id="view-container"></div>
    </main>

    <!-- Single Floating AI Drawer Trigger (Bottom-Right) -->
    <button id="floating-ai-btn" onclick="toggleDrawer(true)"
      class="fixed bottom-6 right-6 bg-[#4F46E5] hover:bg-indigo-700 text-white font-extrabold px-5 py-3 rounded-full shadow-xl shadow-indigo-500/30 flex items-center gap-2 text-xs transition-all transform hover:scale-105 z-40">
      <span class="text-base">⚡</span> Ask AI Copilot
    </button>

    <!-- Floating AI Drawer -->
    <div id="ai-drawer"
      class="fixed inset-y-0 right-0 w-[400px] bg-white border-l border-slate-200 shadow-2xl z-50 flex flex-col hidden">
      <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-indigo-50/50">
        <div class="flex items-center gap-2">
          <span class="text-xl">⚡</span>
          <div>
            <h3 class="font-extrabold text-sm text-indigo-900 font-outfit">AI Copilot Assistant</h3>
            <span class="text-[11px] text-slate-500" id="drawer-context-label">Context-Aware Sales Advisor</span>
          </div>
        </div>
        <button onclick="toggleDrawer(false)"
          class="w-7 h-7 rounded-full bg-slate-200/80 hover:bg-slate-300 flex items-center justify-center text-slate-600 font-bold text-sm">×</button>
      </div>

      <div class="flex-1 p-4 overflow-y-auto space-y-3 bg-slate-50/50" id="drawer-messages">
        <div class="text-center py-10 px-4">
          <div class="text-3xl mb-2">⚡</div>
          <h4 class="font-bold text-sm text-slate-800">SmartCRM AI Copilot</h4>
          <p class="text-xs text-slate-500 mt-1">Ask natural language queries or command safe CRM deal updates.</p>
        </div>
      </div>

      <form onsubmit="sendDrawerChat(event)" class="p-3 border-t border-slate-200 bg-white flex items-center gap-2">
        <input type="text" id="drawer-input" placeholder="Ask AI copilot..."
          class="flex-1 bg-slate-100 border border-slate-300 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-indigo-500 text-slate-900 font-medium" />
        <button type="submit"
          class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-2 rounded-lg text-xs">Send</button>
      </form>
    </div>
  </div>

  <script>
    const API_BASE = typeof window !== "undefined" && (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1")
      ? "http://127.0.0.1:8000/api"
      : "/api";
    let currentPage = 'overview';
    let currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 9);
    let drawerContext = { type: null, id: null };
    let filterOpts = { industries: [], locations: [], customer_types: [], salespeople: [], lead_sources: [] };

    const NAV_ITEMS = [
      { id: 'overview', label: 'Overview', icon: '🏠', title: 'Overview Dashboard', desc: 'Real-time pipeline metrics and key sales performance indicators' },
      { id: 'ai-assistant', label: 'AI Assistant', icon: '🤖', title: 'AI Assistant Workspace', desc: 'Natural language CRM querying, tool calling, and action execution' },
      { id: 'customers', label: 'Customers', icon: '👥', title: 'Customer Directory', desc: 'Manage customer accounts, details, and 360° profile views' },
      { id: 'leads', label: 'Leads', icon: '🎯', title: 'Lead Management', desc: 'Track sales leads, qualification status, and pipeline assignments' },
      { id: 'deals', label: 'Deals', icon: '💰', title: 'Deals & Pipeline', desc: 'Monitor active deal stages, values, and sales ownership' },
      { id: 'at-risk', label: 'At-Risk Deals', icon: '⚠️', title: 'At-Risk Deals BI', desc: 'Stale deal detector and automated follow-up recommendations' },
      { id: 'audit', label: 'Audit & Activity', icon: '📜', title: 'Audit & Activity Log', desc: 'Traceability record of manual and AI-driven database actions' }
    ];

    async function apiFetch(endpoint, options = {}) {
      const res = await fetch(`${API_BASE}${endpoint}`, options);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `HTTP ${res.status}`);
      }
      return res.json();
    }

    async function loadFilterOpts() {
      try {
        filterOpts = await apiFetch('/filters/options');
      } catch (err) { }
    }
    loadFilterOpts();

    function renderNav() {
      const container = document.getElementById('nav-container');
      container.innerHTML = NAV_ITEMS.map(item => {
        const isActive = currentPage === item.id;
        const cls = isActive
          ? 'bg-[#4F46E5] text-white shadow-sm shadow-indigo-500/30'
          : 'text-slate-400 hover:bg-[#1F2937] hover:text-white';
        return `
          <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-semibold transition-all duration-150 ${cls}">
            <span class="text-base">${item.icon}</span>
            <span>${item.label}</span>
          </button>
        `;
      }).join('');
    }

    function navigate(pageId) {
      currentPage = pageId;
      const navItem = NAV_ITEMS.find(n => n.id === pageId);
      if (navItem) {
        document.getElementById('page-title').innerText = navItem.title;
        document.getElementById('page-desc').innerText = navItem.desc;
      }

      const btn = document.getElementById('floating-ai-btn');
      if (pageId === 'ai-assistant') btn.classList.add('hidden');
      else btn.classList.remove('hidden');

      renderNav();
      renderPage();
    }

    function renderPage() {
      const container = document.getElementById('view-container');
      container.innerHTML = '<div class="py-12 text-center text-xs font-semibold text-slate-500">Loading dynamic data from SQLite...</div>';

      if (currentPage === 'overview') loadOverview(container);
      else if (currentPage === 'ai-assistant') loadAiAssistant(container);
      else if (currentPage === 'customers') loadCustomers(container);
      else if (currentPage === 'leads') loadLeads(container);
      else if (currentPage === 'deals') loadDeals(container);
      else if (currentPage === 'at-risk') loadAtRisk(container);
      else if (currentPage === 'audit') loadAudit(container);
    }

    // OVERVIEW PAGE
    async function loadOverview(container) {
      try {
        const data = await apiFetch('/overview');
        const k = data.kpis || {};
        const atRisk = data.deals_requiring_attention || [];
        const pipeStatus = data.pipeline_by_status || [];
        const pipeSp = data.pipeline_by_salesperson || [];

        container.innerHTML = `
          <div class="space-y-5">
            <div class="grid grid-cols-1 md:grid-cols-5 gap-3.5">
              <div onclick="navigate('customers')" class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs hover:border-indigo-400 cursor-pointer">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase"><span>👥 Customers</span><span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded-full text-[10px]">Live</span></div>
                <div class="text-2xl font-extrabold text-slate-900 mt-2 font-outfit">${k.total_customers || 0}</div>
              </div>
              <div onclick="navigate('leads')" class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs hover:border-indigo-400 cursor-pointer">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase"><span>🎯 Total Leads</span><span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded-full text-[10px]">Live</span></div>
                <div class="text-2xl font-extrabold text-slate-900 mt-2 font-outfit">${k.total_leads || 0}</div>
              </div>
              <div onclick="navigate('deals')" class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs hover:border-indigo-400 cursor-pointer">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase"><span>🤝 Active Deals</span><span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded-full text-[10px]">Active</span></div>
                <div class="text-2xl font-extrabold text-slate-900 mt-2 font-outfit">${k.active_deals || 0}</div>
              </div>
              <div onclick="navigate('deals')" class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs hover:border-indigo-400 cursor-pointer">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase"><span>💰 Pipeline Value</span><span class="bg-emerald-50 text-emerald-600 px-1.5 py-0.5 rounded-full text-[10px]">Active</span></div>
                <div class="text-2xl font-extrabold text-slate-900 mt-2 font-outfit">₹${(k.pipeline_value || 0).toLocaleString()}</div>
              </div>
              <div onclick="navigate('at-risk')" class="bg-white border border-slate-200 rounded-xl p-3.5 shadow-2xs hover:border-rose-400 cursor-pointer">
                <div class="flex items-center justify-between text-xs font-semibold text-slate-500 uppercase"><span>⚠️ At-Risk Deals</span><span class="bg-rose-50 text-rose-600 px-1.5 py-0.5 rounded-full text-[10px] font-bold">Action Req</span></div>
                <div class="text-2xl font-extrabold text-rose-600 mt-2 font-outfit">${k.at_risk_count || 0}</div>
              </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-2xs">
                <h3 class="text-sm font-extrabold text-slate-900 font-outfit mb-3">Pipeline Value by Stage</h3>
                <div class="space-y-2">
                  ${pipeStatus.map(s => `
                    <div>
                      <div class="flex justify-between text-xs font-semibold mb-1"><span>${s.status} (${s.count})</span><span>₹${Number(s.total_value).toLocaleString()}</span></div>
                      <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-indigo-600 h-full rounded-full" style="width: ${Math.min(100, (s.total_value / (k.pipeline_value || 1)) * 100)}%"></div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>

              <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-2xs">
                <h3 class="text-sm font-extrabold text-slate-900 font-outfit mb-3">Pipeline Value by Salesperson</h3>
                <div class="space-y-2">
                  ${pipeSp.map(sp => `
                    <div>
                      <div class="flex justify-between text-xs font-semibold mb-1"><span>${sp.salesperson} (${sp.deal_count} deals)</span><span>₹${Number(sp.total_value).toLocaleString()}</span></div>
                      <div class="w-full bg-slate-100 h-2.5 rounded-full overflow-hidden">
                        <div class="bg-indigo-500 h-full rounded-full" style="width: ${Math.min(100, (sp.total_value / (k.pipeline_value || 1)) * 100)}%"></div>
                      </div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-2xs">
              <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-extrabold text-slate-900 font-outfit flex items-center gap-2"><span>⚠️</span> Deals Requiring Immediate Follow-Up</h3>
                <button onclick="navigate('at-risk')" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800">View All →</button>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                  <thead>
                    <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase"><th class="py-2.5 px-3">Deal Title</th><th class="py-2.5 px-3">Customer</th><th class="py-2.5 px-3">Value</th><th class="py-2.5 px-3">Status</th><th class="py-2.5 px-3">Days Inactive</th><th class="py-2.5 px-3">Action</th></tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 font-medium text-slate-700">
                    ${atRisk.map(d => `
                      <tr class="hover:bg-slate-50">
                        <td class="py-2.5 px-3 font-bold text-slate-900">${d.title}</td>
                        <td class="py-2.5 px-3">${d.customer_name}</td>
                        <td class="py-2.5 px-3 font-semibold text-slate-900">₹${Number(d.value).toLocaleString()}</td>
                        <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-50 text-amber-700 border border-amber-200">${d.status}</span></td>
                        <td class="py-2.5 px-3 text-rose-600 font-bold">${d.days_stale} days</td>
                        <td class="py-2.5 px-3 text-slate-600 italic">${d.suggested_next_action || 'Follow up immediately'}</td>
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `<div class="p-4 bg-rose-50 border border-rose-200 text-rose-700 text-xs rounded-lg">Error loading overview: ${err.message}</div>`;
      }
    }

    // AI ASSISTANT PAGE
    async function loadAiAssistant(container) {
      container.innerHTML = `
        <div class="bg-white border border-slate-200 rounded-xl shadow-2xs overflow-hidden flex h-[76vh]">
          <div class="w-[280px] border-r border-slate-200 bg-slate-50/70 p-4 flex flex-col">
            <button onclick="newAiSession()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-3 rounded-lg text-xs flex items-center justify-center gap-2 mb-4 shadow-2xs">➕ New Chat Session</button>
            <h4 class="text-xs font-bold text-slate-500 uppercase mb-2">Conversation History</h4>
            <div class="flex-1 overflow-y-auto space-y-1" id="ai-sessions-list">Loading chats...</div>
          </div>
          <div class="flex-1 flex flex-col bg-white">
            <div class="p-3.5 border-b border-slate-200 bg-slate-50/40">
              <h3 class="font-extrabold text-sm text-slate-900 font-outfit">AI Sales Advisor Workspace</h3>
              <p class="text-[11px] text-slate-500">Query CRM records, evaluate risks, or execute safe mutations</p>
            </div>
            <div class="flex-1 p-4 overflow-y-auto space-y-3" id="ai-thread"></div>
            <form onsubmit="sendAiPageChat(event)" class="p-3 border-t border-slate-200 flex gap-2">
              <input type="text" id="ai-page-input" placeholder="Type your natural language request..." class="flex-1 bg-slate-50 border border-slate-300 rounded-lg px-4 py-2.5 text-xs text-slate-900 focus:outline-none" />
              <button type="submit" class="bg-indigo-600 text-white font-bold px-5 py-2.5 rounded-lg text-xs">Send Request</button>
            </form>
          </div>
        </div>
      `;

      loadAiSessionsList();
      loadAiThread();
    }

    async function loadAiSessionsList() {
      try {
        const sessions = await apiFetch('/ai/conversations');
        const container = document.getElementById('ai-sessions-list');
        if (!container) return;
        if (sessions.length > 0 && !sessions.some(s => s.id === currentSessionId)) {
          currentSessionId = sessions[0].id;
          loadAiThread();
        }
        container.innerHTML = sessions.map(s => `
          <button onclick="switchAiSession('${s.id}')" class="w-full text-left p-2.5 rounded-lg text-xs font-semibold truncate ${s.id === currentSessionId ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 'text-slate-700 hover:bg-slate-200/60'}">
            💬 ${s.title || 'Conversation Session'}
          </button>
        `).join('');
      } catch (err) { }
    }

    async function loadAiThread() {
      try {
        const msgs = await apiFetch(`/ai/conversations/${currentSessionId}`);
        const thread = document.getElementById('ai-thread');
        if (!thread) return;
        if (msgs.length === 0) {
          thread.innerHTML = `
            <div class="text-center py-16 max-w-md mx-auto">
              <div class="text-4xl mb-3">🤖</div>
              <h3 class="text-base font-extrabold text-slate-800 font-outfit">How can I assist your sales team today?</h3>
              <p class="text-xs text-slate-500 mt-1">Try asking: "Move Rahul's deal to Won", "Show me deals over ₹10,000", or "What should I prioritize today?".</p>
            </div>
          `;
        } else {
          thread.innerHTML = msgs.map(m => `
            <div class="flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}">
              <div class="max-w-[80%] rounded-xl p-3.5 text-xs ${m.role === 'user' ? 'bg-indigo-600 text-white font-medium shadow-2xs' : 'bg-slate-100 border border-slate-200 text-slate-900'}">${m.content}</div>
            </div>
          `).join('');
        }
      } catch (err) { }
    }

    function newAiSession() {
      currentSessionId = 'sess_' + Math.random().toString(36).substring(2, 9);
      loadAiSessionsList();
      loadAiThread();
    }

    function switchAiSession(id) {
      currentSessionId = id;
      loadAiSessionsList();
      loadAiThread();
    }

    async function sendAiPageChat(e, overrideText = null, candidateId = null, candidateIndex = null) {
      if (e) e.preventDefault();
      const input = document.getElementById('ai-page-input');
      const text = overrideText || input?.value.trim();
      if (!text) return;
      if (input) input.value = '';

      const thread = document.getElementById('ai-thread');
      thread.innerHTML += `<div class="flex justify-end"><div class="max-w-[80%] rounded-xl p-3.5 text-xs bg-indigo-600 text-white font-medium">${text}</div></div>`;
      thread.innerHTML += `<div id="ai-loading" class="text-xs text-slate-500">⚡ Querying CRM database...</div>`;

      try {
        const payload = { message: text, conversation_id: currentSessionId, session_id: currentSessionId };
        if (candidateId) payload.candidate_id = candidateId;
        if (candidateIndex) payload.candidate_index = candidateIndex;
        if (text.startsWith('Option ')) payload.action = 'select_candidate';

        const res = await apiFetch('/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        document.getElementById('ai-loading')?.remove();

        let replyHtml = `<div class="flex justify-start"><div class="max-w-[85%] rounded-xl p-3.5 text-xs bg-slate-100 border border-slate-200 text-slate-900 space-y-2">${res.reply.replace(/\n/g, '<br/>')}`;

        if (res.options && res.options.length > 0) {
          replyHtml += `<div class="mt-3 flex flex-col gap-2">`;
          res.options.forEach((opt, idx) => {
            const isConfirm = opt.id === 'confirm' || opt.title.includes('Confirm');
            const isCancel = opt.id === 'cancel' || opt.title.includes('Cancel');
            const msgToSend = isConfirm ? 'Confirm' : isCancel ? 'Cancel' : `Option ${idx + 1}`;
            const btnCls = isConfirm ? 'bg-emerald-600 hover:bg-emerald-700 text-white' : isCancel ? 'bg-rose-50 border border-rose-200 text-rose-700 hover:bg-rose-100' : 'bg-indigo-50 hover:bg-indigo-100 text-indigo-900 border border-indigo-200';
            replyHtml += `<button onclick="sendAiPageChat(null, '${msgToSend}', '${opt.id}', ${idx + 1})" class="w-full text-left px-3.5 py-2 rounded-xl text-xs font-bold transition-all flex items-center justify-between shadow-2xs ${btnCls}"><span>${opt.title}</span><span>➔</span></button>`;
          });
          replyHtml += `</div>`;
        }
        replyHtml += `</div></div>`;
        thread.innerHTML += replyHtml;

        loadAiSessionsList();
      } catch (err) {
        document.getElementById('ai-loading')?.remove();
        thread.innerHTML += `<div class="text-xs text-rose-600">Error: ${err.message}</div>`;
      }
    }

    // CUSTOMERS PAGE
    let custState = { search: '', industry: 'All', location: 'All', type: 'All', minDeals: 0 };
    async function loadCustomers(container) {
      try {
        const params = new URLSearchParams({ search: custState.search, industry: custState.industry, location: custState.location, customer_type: custState.type, min_deals: custState.minDeals.toString(), page: '1', page_size: '20' });
        const data = await apiFetch(`/customers?${params}`);
        const items = data.items || [];

        container.innerHTML = `
          <div class="bg-white border border-slate-200 rounded-xl p-4 shadow-2xs space-y-4">
            <input type="text" value="${custState.search}" oninput="custState.search=this.value; loadCustomers(document.getElementById('view-container'))" placeholder="🔍 Search customers, companies, emails or phone..." class="w-full bg-[#F8FAFC] border border-[#CBD5E1] rounded-lg px-4 py-2.5 text-xs text-slate-900 font-medium focus:outline-none" />

    async function promptDealUpdate(id, title, currentStatus) {
      const newStatus = prompt(`Update stage for deal "${title}":\n(New, Contacted, Qualified, Proposal, Won, Lost)`, currentStatus);
      if (newStatus && newStatus !== currentStatus) {
        try {
          await apiFetch(`/deals/${id}/status`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status: newStatus })
          });
          alert(`Successfully updated deal "${title}" to ${newStatus}!`);
          renderPage();
        } catch (err) {
          alert(`Error: ${err.message}`);
        }
      }
    }

                  <option value="UPDATE_DEAL_STATUS" ${auditState.actionType === 'UPDATE_DEAL_STATUS' ? 'selected' : ''}>UPDATE_DEAL_STATUS</option>
                  <option value="ASSIGN_LEAD" ${auditState.actionType === 'ASSIGN_LEAD' ? 'selected' : ''}>ASSIGN_LEAD</option>
                  <option value="CREATE_CUSTOMER" ${auditState.actionType === 'CREATE_CUSTOMER' ? 'selected' : ''}>CREATE_CUSTOMER</option>
                  <option value="ADD_NOTE" ${auditState.actionType === 'ADD_NOTE' ? 'selected' : ''}>ADD_NOTE</option>
                </select>
              </div>

              <div>
                <label class="block text-[10px] font-bold text-slate-500 uppercase mb-1">Performed By</label>
                <select onchange="auditState.performedBy=this.value; loadAudit(document.getElementById('view-container'))" class="w-full bg-white border border-slate-300 rounded px-2 py-1.5 text-xs font-semibold text-slate-800">
                  <option value="All">All Performers</option>
                  <option value="react_ui" ${auditState.performedBy === 'react_ui' ? 'selected' : ''}>react_ui</option>
                  <option value="ai_agent" ${auditState.performedBy === 'ai_agent' ? 'selected' : ''}>ai_agent</option>
                  <option value="test_suite" ${auditState.performedBy === 'test_suite' ? 'selected' : ''}>test_suite</option>
                </select>
              </div>

              <div class="flex items-end">
                <button onclick="auditState={actionType:'All',performedBy:'All'}; loadAudit(document.getElementById('view-container'))" class="w-full bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold py-1.5 px-3 rounded text-xs">Clear Filters</button>
              </div>
            </div>

            <div class="overflow-x-auto">
              <table class="w-full text-left text-xs">
                <thead>
                  <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 font-bold uppercase"><th class="py-2.5 px-3">Timestamp</th><th class="py-2.5 px-3">Performed By</th><th class="py-2.5 px-3">Action Type</th><th class="py-2.5 px-3">Target Entity</th><th class="py-2.5 px-3">Updated Value</th></tr>
                </thead>
                <tbody class="divide-y divide-slate-100 font-medium text-slate-700">
                  ${items.map(log => `
                    <tr class="hover:bg-slate-50">
                      <td class="py-2.5 px-3 font-semibold text-slate-500">${log.timestamp}</td>
                      <td class="py-2.5 px-3 font-bold text-indigo-700">${log.performed_by}</td>
                      <td class="py-2.5 px-3"><span class="px-2 py-0.5 rounded text-[10px] font-extrabold bg-slate-100 text-slate-800 border border-slate-200">${log.action_type}</span></td>
                      <td class="py-2.5 px-3 font-semibold text-slate-900">${log.target_table} #${log.target_id}</td>
                      <td class="py-2.5 px-3 text-emerald-700 font-mono text-[11px] truncate max-w-[180px]">${log.after_value}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>
        `;
      } catch (err) { }
    }

    // FLOATING AI DRAWER CONTROLS
    function toggleDrawer(show) {
      const drawer = document.getElementById('ai-drawer');
      if (show) drawer.classList.remove('hidden');
      else drawer.classList.add('hidden');
    }

    async function sendDrawerChat(e, overrideText = null) {
      if (e) e.preventDefault();
      const input = document.getElementById('drawer-input');
      const text = overrideText || input?.value.trim();
      if (!text) return;
      if (input) input.value = '';

      const container = document.getElementById('drawer-messages');
      container.innerHTML += `<div class="flex justify-end"><div class="max-w-[85%] rounded-xl p-3 text-xs bg-indigo-600 text-white font-medium">${text}</div></div>`;
      container.innerHTML += `<div id="drawer-loading" class="text-xs text-slate-500">⚡ Thinking...</div>`;

      try {
        const res = await apiFetch('/ai/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, conversation_id: currentSessionId })
        });
        document.getElementById('drawer-loading')?.remove();

        let replyHtml = `<div class="flex justify-start"><div class="max-w-[85%] rounded-xl p-3 text-xs bg-white border border-slate-200 text-slate-800 space-y-2">${res.reply.replace(/\n/g, '<br/>')}`;

        if (res.options && res.options.length > 0) {
          replyHtml += `<div class="mt-2.5 flex flex-wrap gap-2">`;
          res.options.forEach(opt => {
            replyHtml += `<button onclick="sendDrawerChat(null, '${opt.title.includes('Confirm') ? 'Confirm' : 'Option 1'}')" class="px-3 py-1 rounded text-xs font-bold ${opt.id === 'cancel' ? 'bg-rose-50 text-rose-700 border border-rose-200' : 'bg-indigo-600 text-white'}">${opt.title}</button>`;
          });
          replyHtml += `</div>`;
        }
        replyHtml += `</div></div>`;
        container.innerHTML += replyHtml;

      } catch (err) {
        document.getElementById('drawer-loading')?.remove();
        container.innerHTML += `<div class="text-xs text-rose-600">Error: ${err.message}</div>`;
      }
    }

    renderNav();
    renderPage();
  </script>
</body>

</html>
